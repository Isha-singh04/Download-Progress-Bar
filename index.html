<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Progress</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <div class="download-box">
        <h3>Download Progress</h3>
        <button class="close-btn">✖</button>
        <div class="content">
            <p class="status">Downloading... <span id="progress-text">0%</span></p>
            <div class="progress-bar">
                <div class="progress" id="progress"></div>
            </div>
            <p>Estimated time remaining: <span id="time">50</span> sec</p>
            <button class="download-btn" id="download-btn">Start Download</button>
        </div>
    </div>

    <script src="./script.js"></script>
</body>
</html>
